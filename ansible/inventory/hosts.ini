[master]
master ansible_host=192.168.56.11 ansible_ssh_private_key_file=~/.ssh/id_rsa_master

[workers]
worker1 ansible_host=192.168.56.12 ansible_ssh_private_key_file=~/.ssh/id_rsa_worker1
worker2 ansible_host=192.168.56.13 ansible_ssh_private_key_file=~/.ssh/id_rsa_worker2

[storage]
storage ansible_host=192.168.56.14 ansible_ssh_private_key_file=~/.ssh/id_rsa_storage

[cluster:children]
master
workers
storage

[all:vars]
ansible_user=root
ansible_become=yes
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
