---
- name: Cài đặt dependencies hệ thống cho Miniconda
  apt:
    name:
      - bzip2
      - tar
      - wget
      - ca-certificates
      - build-essential
      - python3-dev
    state: present
    update_cache: yes

- name: Tải Miniconda script
  get_url:
    url: "{{ miniconda_url }}"
    dest: "/home/{{ ansible_user }}/miniconda.sh"
    mode: '0755'
  register: download_conda
  until: download_conda is succeeded
  retries: 5
  delay: 10

- name: Cài đặt Miniconda
  shell: "/bin/bash /home/{{ ansible_user }}/miniconda.sh -b -u -p {{ install_dir }}"
  args:
    creates: "{{ install_dir }}/bin/conda"

- name: Thêm biến môi trường PATH vào /etc/profile.d/conda.sh
  lineinfile:
    path: /etc/profile.d/conda.sh
    line: "export PATH={{ install_dir }}/bin:$PATH"
    create: yes

- name: Chấp nhận Điều khoản sử dụng (TOS) của Anaconda
  shell: "{{ install_dir }}/bin/conda tos accept --override-channels --channel {{ item }}"
  loop:
    - "https://repo.anaconda.com/pkgs/main"
    - "https://repo.anaconda.com/pkgs/r"
  ignore_errors: yes
  changed_when: false

- name: Init môi trường Conda '{{ env_name }}' với Python {{ python_version }}
  shell: "{{ install_dir }}/bin/conda create -y -n {{ env_name }} python={{ python_version }}"
  args:
    creates: "{{ install_dir }}/envs/{{ env_name }}"

# ── Member 3: Topic Modeling dependencies ───────────────────────────────────
# Bước 1: Cài các thư viện PyPI thông thường
- name: Cài đặt Python dependencies cho Spark jobs (Member 3 - PyPI)
  shell: |
    {{ install_dir }}/envs/{{ env_name }}/bin/pip install \
      pandas \
      pydantic \
      pyarrow \
      clickhouse-connect \
      underthesea \
      mmh3 \
      bertopic \
      sentence-transformers \
      umap-learn \
      hdbscan \
      gensim \
      pyLDAvis \
      scikit-learn

# Bước 2: Cài PyTorch CPU riêng (--index-url phải tách ra để không override PyPI ở bước 1)
- name: Cài đặt PyTorch CPU (Member 3 - GPU-free cho server)
  shell: |
    {{ install_dir }}/envs/{{ env_name }}/bin/pip install \
      torch \
      torchvision \
      torchaudio \
      --index-url https://download.pytorch.org/whl/cpu

- name: Cấp quyền sở hữu thư mục Miniconda cho user '{{ ansible_user }}'
  file:
    path: "{{ install_dir }}"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    recurse: yes
