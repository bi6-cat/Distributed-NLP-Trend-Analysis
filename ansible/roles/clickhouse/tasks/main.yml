---
- name: Đảm bảo apt-transport-https được cài
  apt:
    name: ['apt-transport-https', 'ca-certificates', 'dirmngr']
    state: present
    update_cache: yes

- name: Thêm GPG key của thư viện ClickHouse
  apt_key:
    keyserver: "{{ clickhouse_keyserver }}"
    id: "{{ clickhouse_gpg_id }}"
  ignore_errors: yes

- name: Thêm repository ClickHouse
  apt_repository:
    repo: "{{ clickhouse_repo_url }}"
    state: present

- name: Tải và cài đặt ClickHouse
  apt:
    name: ['clickhouse-server', 'clickhouse-client']
    state: present
    update_cache: yes

- name: Cho phép ClickHouse listen trên tất cả IP
  copy:
    dest: /etc/clickhouse-server/config.d/listen_host.xml
    content: |
      <clickhouse>
          <listen_host>0.0.0.0</listen_host>
      </clickhouse>
    owner: clickhouse
    group: clickhouse
    mode: '0644'
  notify: Restart ClickHouse

- name: Đảm bảo dịch vụ ClickHouse đang chạy
  systemd:
    name: clickhouse-server
    state: started
    enabled: yes
