version: 2

models:
  # ------ WIDE FACT ------
  - name: fct_topic_activity
    description: >
      Wide fact table (grain: topic_id × source × hour_bucket).
      Merges trend scoring + sentiment timeseries into ONE table.
      source_type and topic_label are embedded — zero JOINs needed in dashboards.
      Atomic metric sums (reaction_sum, comment_sum, view_sum) preserved for
      granular breakdowns at aggregate level.
    columns:
      - name: topic_id
        tests:
          - not_null
      - name: trend_score
        tests:
          - not_null
      - name: volume_zscore
        description: Standard deviations from 7-day rolling mean (volume anomaly signal)
      - name: z_score_neg_ratio
        description: Standard deviations from 24h rolling mean of neg_ratio (sentiment anomaly signal)

  # ------ CRISIS FACT ------
  - name: fct_crisis_events
    description: >
      Crisis events from M4's Isolation Forest anomaly detector,
      enriched with embedded topic labels via arrayJoin pattern.
    columns:
      - name: event_id
        tests:
          - unique
          - not_null

  # ------ DIMENSIONS ------
  - name: dim_topics
    description: >
      Topic lookup for filter widgets. NOT joined on the main fact table —
      labels are pre-embedded in fct_topic_activity at write time.
    columns:
      - name: topic_id
        tests:
          - unique
          - not_null
