version: 2

sources:
  - name: tech_radar
    description: >
      ClickHouse staging tables — 3 decoupled landing zones loaded independently
      by Spark jobs (M2, M3, M4), plus supporting reference tables.
    database: tech_radar
    tables:
      - name: stg_posts_core
        description: >
          Core post data with atomic engagement metrics. Loaded by M2 (flatten+clean+dedup).
        columns:
          - name: post_id
            description: Canonical PK across all stages
            tests:
              - not_null
              - unique
          - name: source
            tests:
              - not_null
              - accepted_values:
                  values: ['voz', 'tinhte', 'vnexpress', 'youtube', 'vatvo']

      - name: stg_posts_nlp
        description: >
          PhoBERT sentiment labels. Loaded by M4.
          ReplacingMergeTree ensures latest prediction wins on reruns.
        columns:
          - name: post_id
            tests:
              - not_null

      - name: stg_post_topics
        description: >
          LDA/BERTopic topic assignments. Loaded by M3.
          ReplacingMergeTree ensures latest assignment wins on weekly reruns.
        columns:
          - name: post_id
            tests:
              - not_null

      - name: stg_topics
        description: >
          Topic lookup table — human-readable labels and keywords. Loaded by M3.
        columns:
          - name: topic_id
            tests:
              - not_null
              - unique

      - name: stg_keyword_freq
        description: >
          Count-Min Sketch keyword frequencies per sliding window. Loaded by M3.

      - name: stg_crisis_events
        description: >
          Isolation Forest anomaly detection output. Loaded by M4.
        columns:
          - name: event_id
            tests:
              - not_null
              - unique

models:
  - name: stg_posts_core
    description: Staging layer for core post data. Loads raw table from source.
    columns:
      - name: post_id
      - name: source
      - name: author_id
      - name: author_name
      - name: title
      - name: body
      - name: segmented_text
      - name: parent_id
      - name: reaction_count
      - name: comment_count
      - name: view_count
      - name: created_at
      - name: crawled_at
  - name: stg_posts_nlp
    description: Staging layer for NLP sentiment data. Loads raw table from source.
    columns:
      - name: post_id
      - name: sentiment_label
      - name: sentiment_score
  - name: stg_post_topics
    description: Staging layer for topics. Loads raw table from source.
    columns:
      - name: post_id
      - name: topic_id
      - name: topic_probability
